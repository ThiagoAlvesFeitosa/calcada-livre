<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calçada Livre — gravar trecho</title>
  <link rel="stylesheet" href="/estatico/estilos.css">
</head>
<body>
  <header>
    <h1>Calçada Livre</h1>
    <nav><a href="/">Gravar</a> <a href="/painel">Mapa</a></nav>
  </header>
  <main>
    <section class="tutorial" id="tutorial">
      <p id="passo-texto">1. Celular deitado, na altura do peito, apontado para a calçada 3 a 5 m à frente.</p>
      <button type="button" id="proximo-passo">Próximo</button>
    </section>
    <section class="cartao" id="escolha">
      <button type="button" id="usar-localizacao">Usar minha localização</button>
      <p id="confirmacao" class="escondido"></p>
      <p>
        <button type="button" id="confirmar" class="escondido">Confirmar</button>
        <button type="button" id="escolher-outro" class="escondido secundario">Escolher outro</button>
      </p>
      <p id="rotulo-lista">Ou escolha o trecho na lista:</p>
      <ul id="lista-trechos"></ul>
      <p id="trecho-escolhido">Nenhum trecho selecionado.</p>
    </section>
    <label class="botao">
      Gravar calçada
      <input id="video" class="escondido" type="file" accept="video/*" capture="environment">
    </label>
    <section id="envio" class="escondido cartao">
      <p>Enviando…</p>
      <progress id="barra" max="100" value="0"></progress>
    </section>
    <section id="processando" class="escondido processando">
      <p>Processando o vídeo. Se outro estiver na frente, o seu espera a vez.</p>
      <p id="segundos">0 s</p>
    </section>
    <section id="resultado" class="escondido resultado"></section>
  </main>
  <script src="/estatico/coleta.js"></script>
</body>
</html>
