[project]
name = "calcada-livre"
version = "0.1.0"
description = "Mapa colaborativo de acessibilidade das calçadas"
authors = [
    { name = "ThiagoAlvesFeitosa", email = "thiago.feitosa.alves@hotmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "fastapi",
    "ftfy",
    "lap",
    "opencv-python-headless",
    "python-multipart>=0.0.34",
    "supabase",
    "torch",
    "torchvision",
    "transformers",
    "ultralytics",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["testes"]
