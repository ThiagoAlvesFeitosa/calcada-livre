[project]
name = "calcada-livre"
version = "0.1.0"
description = "Mapa colaborativo de acessibilidade das calçadas"
authors = [
    { name = "ThiagoAlvesFeitosa", email = "thiago.feitosa.alves@hotmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["testes"]
